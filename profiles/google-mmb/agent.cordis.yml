presets:
  - id: gemini-3.8-flash
    name: 'Gemini 3.8 Flash (Default)'
    description: 'Ultra-fast, high-capability agent powered by Google Gemini 3.8 Flash with thinking support'
    model:
      provider: google
      model: gemini-3.8-flash
    tools:
      - antigravity_run
      - antigravity_models
      - antigravity_agents
      - antigravity_cli
      - mmb_catalog
      - mmb_assess_workload
